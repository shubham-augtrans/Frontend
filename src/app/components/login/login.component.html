<div class="login-container">
  <div class="left-content">
    <div class="hero-content">
      <i class="pi pi-microchip-ai"></i>
      <h1 class="platform-title">Welcome to Our Platform</h1>
      <p class="platform-subtitle">Sign in to access your account</p>
    </div>
  </div>
  <div class="right-content">
    <div class="card login-card">
      <div class="login-header">
        <i class="pi pi-user-plus login-icon"></i>
        <h2 class="login-title">Welcome Back</h2>
        <p class="login-subtitle">Sign in to your account</p>
      </div>

     <form [formGroup]="userForm" (ngSubmit)="onLogin()" class="flex flex-column gap-4">
  <div class="field">
    <label for="username" class="block text-900 font-medium mb-2">
      <i class="pi pi-user field-icon"></i>
      Username
    </label>
    <div class="p-inputgroup">
      <span class="p-inputgroup-addon">
        <i class="pi pi-user"></i>
      </span>
      <input pInputText id="username" formControlName="username" type="text" class="w-full" placeholder="Enter your username" />
    </div>
    <small *ngIf="userForm.get('username')?.invalid && userForm.get('username')?.touched" class="p-error block mt-1">
      <i class="pi pi-exclamation-triangle"></i>
      Username is required (at least 1 character).
    </small>
  </div>

  <div class="field">
    <label for="password" class="block text-900 font-medium mb-2">
      <i class="pi pi-lock field-icon"></i>
      Password
    </label>
    <div class="p-inputgroup">
      <span class="p-inputgroup-addon">
        <i class="pi pi-lock"></i>
      </span>
      <input pInputText id="password" formControlName="password" type="password" class="w-full" placeholder="Enter your password" />
    </div>
    <small *ngIf="userForm.get('password')?.invalid && userForm.get('password')?.touched" class="p-error block mt-1">
      <i class="pi pi-exclamation-triangle"></i>
      <ng-container *ngIf="userForm.get('password')?.errors?.['required']">Password is required.</ng-container>
      <ng-container *ngIf="userForm.get('password')?.errors?.['minlength']">Password must be at least 5 characters.</ng-container>
      <ng-container *ngIf="userForm.get('password')?.errors?.['noUppercase']">Password must contain at least one uppercase letter.</ng-container>
    </small>
  </div>

  <div class="button-container">
    <p-button label="Sign In" type="submit" icon="pi pi-sign-in" styleClass="login-button" [disabled]="userForm.invalid" [loading]="false" />
  </div>
</form>
    </div>
  </div>
</div>
